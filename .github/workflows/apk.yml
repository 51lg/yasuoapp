name: 打包全自动解压器

on:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: 🐦 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 显式安装 cffi 和 pycryptodomex 以增强兼容性
          pip install flet pyzipper pycryptodomex cffi

      - name: 📝 准备入口文件
        run: |
          cp 手机叔叔解压.py main.py

      - name: 🚀 编译 APK
        run: |
          flet build apk . \
            --project "AutoExtractor" \
            --org "com.shushu.extractor" \
            --product "全自动解压器" \
            --android-permissions \
              android.permission.READ_EXTERNAL_STORAGE=True \
              android.permission.WRITE_EXTERNAL_STORAGE=True \
              android.permission.MANAGE_EXTERNAL_STORAGE=True \
            --yes --verbose

      - name: 📤 上传生成的 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoExtractor-Android
          path: build/apk/
          if-no-files-found: error
