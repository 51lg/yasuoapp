name: 打包全自动解压器 APK

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动触发

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 配置 Java 环境 (Flet 编译 Android 必备)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: 🐦 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📝 转换入口文件名
        # 将你的文件名复制为 Flet 默认识别的 main.py
        run: |
          cp 手机叔叔解压.py main.py

      - name: 🚀 编译 APK (含安卓 11+ 存储权限)
        run: |
          flet build apk . \
            --project "AutoExtractor" \
            --org "com.shushu.extractor" \
            --product "全自动解压器" \
            --android-permissions \
              android.permission.READ_EXTERNAL_STORAGE=True \
              android.permission.WRITE_EXTERNAL_STORAGE=True \
              android.permission.MANAGE_EXTERNAL_STORAGE=True \
            --yes --verbose

      - name: 📤 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: AutoExtractor-Android-Build
          path: build/apk/
          if-no-files-found: error
