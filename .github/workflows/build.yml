name: Build Android APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install flet pyzipper

      - name: 执行 Flet 打包为 APK
        run: |
          yes | flet build apk 手机叔叔解压.py

      - name: 上传 APK 文件供下载
        uses: actions/upload-artifact@v4
        with:
          name: 手机叔叔解压-APK
          path: build/apk/*.apk
